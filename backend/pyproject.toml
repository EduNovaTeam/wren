[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wren-backend"
version = "0.1.0"
description = "Wren 后端：会话、回合记录与设置"
requires-python = ">=3.11"
dependencies = [
  "flask>=3.1,<4",
  "requests>=2.32,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "ruff>=0.17,<0.18",
]

[tool.setuptools.packages.find]
include = ["wren*"]

[tool.setuptools.package-data]
wren = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
